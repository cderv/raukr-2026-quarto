# Dark variant of the RaukR brand. Keep this file ASCII only for C/POSIX locale compatibility.
meta:
  name: RaukR 2026 - Quarto

color:
  palette:
    teal: "#4C979F"
    teal-light: "#A6CBCF"
    teal-lighter: "#D1E5E6"
    ink: "#1c2833"
    ink-code: "#141c25"
    paper: "#e8edf0"
  primary: teal
  secondary: teal-light
  foreground: paper
  background: ink

typography:
  fonts:
    - family: Albert Sans
      source: google
      weight: [400, 600, 700]
    - family: Fira Mono
      source: google
      weight: [400, 500]
  base:
    family: Albert Sans
    line-height: 1.5
  headings:
    family: Albert Sans
    weight: 600
  monospace:
    family: Fira Mono
    # Use a dark code background so the adaptive arrow theme meets WCAG AA contrast.
    background-color: ink-code
  link:
    color: teal-light
