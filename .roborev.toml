agent = 'codex'
backup_agent = 'claude-code'
exclude_patterns = ['_freeze/**', 'renv/activate.R']

review_guidelines = """
This repo is workshop material, not an application: Quarto slides, labs and prose
(`.qmd`, `.md`), a `_brand.yml`, a `justfile`, and a little R tooling. The rules below
are the repo's own conventions (they live in `.claude/rules/`) and matter more here
than generic code style. A finding that cites one of them is worth more than a
generic one.

## Public repo -- roles and artifacts, never people
Both this repo and the exercises repo are public.
- Never let a diff commit an assessment of a named person's work, a quote from
  private correspondence, or third-party personal data. Write "the organizer-suggested
  list", not someone's name.
- Never let an issue-tracker id (a `br-...` token) into a tracked file.

## `exercises/` is generated -- never hand-edited
`tools/sync-exercises.R` is the only write path: it builds `exercises/` from `labs/`,
the root `_brand.yml`, and `tools/exercises-scaffold/`.
- Flag any edit to `exercises/` that has no matching source change.
- Flag a `labs/**` change whose commit does not also regenerate `exercises/`
  (`just exercises`); a CI drift-guard will fail otherwise.
- Structural invariants of the delivered payload: no `_quarto.yml` at or above
  `day1-intro/` or `day2-projects/` (`day2-projects/` ships without one on purpose --
  creating it IS the Day-2 exercise); `solutions/day1` and `solutions/day2` stay
  sibling folders, never nested inside a day folder; `starter.qmd`,
  `penguins-report.qmd`, `sample-typst.qmd` and `penguins-by-species.qmd` stay OFF
  the `render:` list in `_quarto.yml`; the payload stays small (no `_freeze/`,
  `_extensions/`, `slides/`).

## R dependencies
`renv.lock` is the pinning source of truth, driven by `DESCRIPTION` `Imports:`.
Flag a lockfile that gains a package with no matching `DESCRIPTION` entry, and the
reverse. The exercises payload has its own pair
(`tools/exercises-scaffold/DESCRIPTION` + `renv.lock`) and its own package list;
a package added for a lab has to reach that pair too, not just the root one.

## `_brand.yml` and the theme
- `_brand.yml` must stay pure ASCII. A single non-ASCII byte makes R's
  `read_brand_yml()` return an empty palette under a C locale, and every `pal()`
  call then fails with an invalid colour name.
- A palette key written `teal-lighter:` is looked up from R as `"teal_lighter"`.
  Do not "fix" an R-side underscore to match the YAML hyphen -- that breaks it.
- `link` is not a colour role: it belongs under `typography.link.color`, not `color:`.
- In any HTML `theme:`, a named bootswatch must come BEFORE `brand`
  (`theme: [cosmo, brand]`). A bare `theme: cosmo` silently defeats the brand palette
  while typography still changes, so it looks like it worked.
- Colour changes must clear WCAG AA; the brand teals are tuned as fills and several
  fail as text.

## `justfile` must stay cross-platform (participants use Windows)
- Any Unix-only command (`rm -rf`, `cp`, globbing, Unix `&&` chains) needs an
  `[unix]` / `[windows]` recipe split.
- A `[windows]` script recipe's shebang must be a bare interpreter name
  (`#!powershell.exe`); a shebang containing `/` is routed through `cygpath.exe`
  and requires Git Bash.

## Prose voice (`.qmd`, `README.md`)
Participant-facing prose follows a deliberate house voice: short declarative
sentences, asides in parentheses. Flag:
- mid-sentence em-dash asides (use parentheses, a colon, or a new sentence), and
  semicolons;
- participial voice-over tails ("..., making it easy to X") and reassurance
  narration ("don't worry", "no magic here");
- corporate verbs (leverage, utilize, facilitate, streamline) and vague intensifiers
  (really, very, simply);
- idiomatic English ("hit the ground running", "low-hanging fruit") -- the author
  writes English as a second language and idiom reads as not his voice;
- French spacing, i.e. a space before `?` `!` `:`.

## Slides (`slides/**/*.qmd`)
- Literal Quarto markup shown in prose must be a fenced code block, never inline.
  For an inline executable expression, a single brace runs it and a double brace
  shows it literally.
- `::: {.smaller}` on a div does nothing (the theme scopes `.smaller` to the slide or
  the deck). Use `smaller: true`, or an inline font-size span for one line.
- On a `{.center}` slide, an `::: aside` overlaps the vertically-centred body -- a
  footer line has to stay in normal flow.
- A slide whose teaching point is a cell option (`#| label:`, `#| fig-cap:`) needs
  `#| echo: fenced`, or the `#|` lines are stripped from the displayed code.
- Slide fit cannot be judged from a diff. If a slide gains content, say so as a note
  to fit-check it, not as a confident finding.

## Day 2+ is a follow-up for the same cohort
Later-day decks and labs speak to people who were in the room the day before.
- Flag a later-day slide that re-introduces a concept an earlier day already taught
  instead of widening it.
- Flag a "you saw X yesterday" callback as needing verification against the earlier
  deck; a false callback is worse than none.
- In labs the test is different: repetition builds fluency, so only flag the same
  task for the same outcome with no new dimension.
"""
