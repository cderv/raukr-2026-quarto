# Drift-guard: the committed exercises/ tree must stay in sync with its sources (labs/, the root
# _brand.yml, and tools/exercises-scaffold/). If a source changed but `just exercises` wasn't re-run,
# this fails. Same command locally and in CI (no `just` on the runner). The sync uses only base R, so
# setup-r alone is enough -- no package restore needed.
name: exercises-sync

on:
  push:
    paths:
      - "labs/**"
      - "_brand.yml"
      - "tools/exercises-scaffold/**"
      - "tools/sync-exercises.R"
      - "exercises/**"
  pull_request:
    paths:
      - "labs/**"
      - "_brand.yml"
      - "tools/exercises-scaffold/**"
      - "tools/sync-exercises.R"
      - "exercises/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: exercises/ is up to date with its sources
        run: Rscript tools/sync-exercises.R --check
