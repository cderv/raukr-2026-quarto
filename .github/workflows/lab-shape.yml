# Verify that each Challenge step has a checkpoint and a collapsed Hint or Solution.
# The checker runs locally and in CI. It uses base R, so setup-r is the only CI dependency.
name: lab-shape

on:
  push:
    paths:
      - "labs/**"
      - "tools/check-lab-shape.R"
  pull_request:
    paths:
      - "labs/**"
      - "tools/check-lab-shape.R"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shape-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Challenge steps let participants try before the answer
        run: Rscript tools/check-lab-shape.R
