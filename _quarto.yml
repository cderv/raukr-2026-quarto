project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - setup.qmd
    - LICENSE.md
    - slides/*/index.qmd
    - labs/*/index.qmd
    # Participant files are synced separately. The dashboard is a site-only demo.
    - labs/quarto-projects/dashboard.qmd

lang: en

# Typst margin layout requires Quarto 1.9 or later.
quarto-required: ">=1.9.0"

website:
  title: "RaukR 2026 · Quarto"
  site-url: "https://cderv.github.io/raukr-2026-quarto/"
  description: >-
    Two Quarto sessions at RaukR 2026 (Advanced R for Bioinformatics, Visby) —
    Introduction to Quarto and Quarto projects.
  navbar:
    left:
      - text: "Home"
        href: index.qmd
      - text: "Setup"
        href: setup.qmd
      - text: "Day 1 · Intro"
        menu:
          - text: "Slides"
            href: slides/quarto/index.qmd
          - text: "Lab"
            href: labs/quarto/index.qmd
      - text: "Day 2 · Projects"
        menu:
          - text: "Slides"
            href: slides/quarto-projects/index.qmd
          - text: "Lab"
            href: labs/quarto-projects/index.qmd

format:
  html:
    theme: [default, theme-html.scss]
    toc: true
    toc-location: right
    toc-depth: 4
    number-sections: true
    lightbox: auto
    code-copy: true
    code-overflow: wrap

execute:
  freeze: auto
